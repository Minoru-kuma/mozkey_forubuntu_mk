name: llama.cpp v0.7.0 native ARM64 candidate (isolated)

on:
  push:
    branches:
      - ci/llama-v070-arm64-native
    paths:
      - .github/workflows/llama_v070_arm64_native_candidate.yml
      - .github/scripts/llama_v070_arm64_native_candidate.ps1
      - src/mac/installer/zenz_runtime/patches/llama-vocab-gpt2-small-japanese-char.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llama-v070-arm64-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Native Windows ARM64 pinned llama-server / Zenz smoke
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Mozkey source (read-only)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - name: Build and test pinned v0.7.0 on native ARM64
        run: |
          & .\.github\scripts\llama_v070_arm64_native_candidate.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'mozkey-llama-v070-arm64-candidate')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated candidate and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-v070-native-arm64-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mozkey-llama-v070-arm64-candidate/evidence/**
            ${{ runner.temp }}/mozkey-llama-v070-arm64-candidate/candidate/llama-server.exe
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
