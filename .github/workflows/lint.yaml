name: CI for Lint checks
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_docker.md

# Full builds run at integration boundaries; lint also runs on branch pushes.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

run-name: "${{ github.workflow }} | ${{ github.ref }} | ${{ github.sha }}"

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  buildifier:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Checkout without submodules to exclude third_party code from lint check
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Run
        working-directory: ./src
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          $(go env GOPATH)/bin/buildifier --mode=diff -r .
