name: llama.cpp v0.7.0 portable ARM64 ClangCL experiment (isolated)

on:
  push:
    branches:
      - ci/llama-v070-arm64-native
    paths:
      - .github/workflows/llama_v070_arm64_portable_candidate.yml
      - .github/scripts/llama_v070_arm64_portable_candidate.ps1
      - .github/scripts/llama_v070_arm64_pe_import_audit.py
      - src/mac/installer/zenz_runtime/patches/llama-vocab-gpt2-small-japanese-char.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llama-v070-arm64-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable_candidate:
    name: Native ARM64 / ClangCL baseline / PE dependency audit / Zenz smoke
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Mozkey source without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - name: Build pinned ARMv8-A ClangCL candidate and audit
        run: |
          & .\.github\scripts\llama_v070_arm64_portable_candidate.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'mozkey-llama-v070-arm64-portable')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable candidate and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-v070-arm64-portable-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mozkey-llama-v070-arm64-portable/evidence/**
            ${{ runner.temp }}/mozkey-llama-v070-arm64-portable/candidate/llama-server.exe
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
