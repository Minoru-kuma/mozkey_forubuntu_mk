name: Zenz runtime lock integrity (read-only)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zenz-runtime-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pinned-runtime:
    name: Verify Windows/macOS pins, staged EXEs, model and patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
      - name: Validate verifier unit tests
        run: python3 -m unittest discover -s tools/zenz_runtime -p 'test_*.py' -v
      - name: Validate exact runtime pins (read only)
        run: python3 tools/zenz_runtime/runtime_lock.py check
