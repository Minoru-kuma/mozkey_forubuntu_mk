syntax = "proto2";
package mozc.fcitx5.recovery;
import "protocol/commands.proto";

// Private local inspection snapshot. Never replay this as IPC or app events.
message Frame {
  required uint32 symbol = 1;
  required uint32 code = 2;
  required uint32 modifiers = 3;
  required bool release = 4;
  required uint32 time = 5;
  optional mozc.commands.Input request = 6;
  optional bool physical = 7 [default = true];
  optional bool translated = 8;
  optional bool japanese_layout = 9;
  optional uint64 generation = 10;
  optional string selection_snapshot = 11;
  optional uint32 cursor = 12;
  optional uint32 anchor = 13;
  optional sint32 selected_length = 14;
  optional uint32 compose = 15;
  optional bytes composed_text = 16;
  optional bool surrounding_valid = 17;
}
message Record {
  repeated Frame pending = 1;
  optional Frame delivering = 2;
  optional mozc.commands.Output outcome = 3;
  optional string preedit = 4;
  optional string reason = 5;
  repeated Frame composing = 6;
}
message Snapshot {
  required uint32 version = 1;
  repeated Record records = 2;
}
